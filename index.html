<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aura</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.min.css">
</head>
<body>

  <header class="site-header">

    <div class="header-top">
      <a href="index.html" class="logo-mark" aria-label="Aura">
        <img src="assets/Aura.svg" alt="Aura">
      </a>

      <nav aria-label="Main">
        <ul class="header-icons">
          <li>
            <a href="profile.html" aria-label="Profile">
              <i class="fa-regular fa-user"></i>
            </a>
          </li>
          <li>
            <a href="#" aria-label="Favorite events">
              <i class="fa-regular fa-heart"></i>
            </a>
          </li>
          <li>
            <a href="#" aria-label="Questions">
              <i class="fa-solid fa-question"></i>
            </a>
          </li>
        </ul>
      </nav>
    </div>

    <nav aria-label="Event period">
      <ul class="period-tabs">
        <li><a href="#" class="active">today</a></li>
        <li><a href="#">tomorrow</a></li>
        <li><a href="#">for a week</a></li>
        <li><a href="#">soon</a></li>
      </ul>
    </nav>

    <form class="search-bar" role="search" onsubmit="return false;">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="search" placeholder="Search" aria-label="Search events">
    </form>
  </header>

  <main>

    <section aria-label="Featured event">
      <a class="event-card-wrapper" href="slavakpss.html" style="--card-bg: url('assets/slavakpss.jpg');">
        <article class="event-card event-card--hero">
          <div class="event-card__image">
            <img src="assets/slavakpss.jpg" alt="Slava KPSS — KATAFALKA">
          </div>
          <div class="event-card__content">
            <div class="event-card__header">
              <h2 class="event-card__title">Slava KPSS</h2>
              <span class="event-card__title">16+</span>
            </div>
            <div class="event-card__desc">
              <p>super anti-hype, the only rapper, gnoin-marmalade and just cute Russian almost Soviet concert</p>
            </div>
          </div>
        </article>
      </a>
    </section>

    <section class="events-grid" aria-label="Upcoming events">

      <a class="event-card-wrapper event-card--small" href="marylinmanson.html" style="--card-bg: url('assets/marylimmanson.jpg');">
        <article class="event-card">
          <div class="event-card__image">
            <img src="assets/marylimmanson.jpg" alt="Marilyn Manson">
          </div>
          <div class="event-card__content">
            <div class="event-card__header">
              <h3 class="event-card__title">Marilyn Manson</h3>
            </div>
            <div class="event-card__desc">
              <p>Gothic rock concert</p>
            </div>
          </div>
        </article>
      </a>

      <a class="event-card-wrapper event-card--small" href="fallinginreverse.html" style="--card-bg: url('assets/fallinginreverce.jpg');">
        <article class="event-card">
          <div class="event-card__image">
            <img src="assets/fallinginreverce.jpg" alt="Falling in Reverse">
          </div>
          <div class="event-card__content">
            <div class="event-card__header">
              <h3 class="event-card__title">Falling in Reverse</h3>
            </div>
            <div class="event-card__desc">
              <p>Alternative rock</p>
            </div>
          </div>
        </article>
      </a>

    </section>

  </main>
</body>
</html>
