<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Your profile — Aura</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/profile.min.css">
</head>
<body>

  <header class="profile-header">
    <a href="index.html" class="logo-mark" aria-label="Aura">
      <img src="assets/Aura.svg" alt="Aura">
    </a>

    <nav aria-label="Main">
      <ul class="header-icons">
        <li>
          <a href="profile.html" aria-label="Profile">
            <i class="fa-regular fa-user"></i>
          </a>
        </li>
        <li>
          <a href="#" aria-label="Favorite events">
            <i class="fa-regular fa-heart"></i>
          </a>
        </li>
        <li>
          <a href="#" aria-label="Questions">
            <i class="fa-solid fa-question"></i>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main class="profile-page">

    <h1 class="profile-title">Your profile</h1>

    <section class="profile-card">
      <div class="profile-card__avatar">
        <img src="assets/ава.jpg" alt="OleGGik">
      </div>

      <div class="profile-card__info">
        <h2 class="profile-name">OleGGik</h2>
        <p class="profile-username">@oleGGik</p>
      </div>
    </section>

    <section class="favorite-conserts">
      <h2 class="favorite-conserts__title">Favorite conserts:</h2>

      <div class="favorite-conserts__list">

        <div class="consert-card">
          <div class="consert-card__image">
            <img src="assets/юг.jpg" alt="404">
          </div>
          <div class="consert-card__meta">
            <span class="consert-card__name">404</span>
            <span class="consert-card__date">26.07.2026</span>
          </div>
        </div>

        <div class="consert-card">
          <div class="consert-card__image">
            <img class="consert-card__image--lazzy" src="assets/lazzy.jpg" alt="Lazzy2Wice">
          </div>
          <div class="consert-card__meta">
            <span class="consert-card__name">lazzy2wice</span>
            <span class="consert-card__date">13.05.2026</span>
          </div>
        </div>

        <div class="consert-card">
          <div class="consert-card__image">
            <img class="consert-card__image--ksd" src="assets/ksd.jpg" alt="Конец солнечных дней">
          </div>
          <div class="consert-card__meta">
            <span class="consert-card__name">конец солнечных дней</span>
            <span class="consert-card__date">24.12.2025</span>
          </div>
        </div>

      </div>
    </section>

  </main>
</body>
</html>
